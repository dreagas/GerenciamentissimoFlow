services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gerenciamentissimoflow_demo}
      POSTGRES_USER: ${POSTGRES_USER:-gerenciamentissimoflow_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured for local demo}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: gerenciamentissimoflow:local
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gerenciamentissimoflow_demo}
      DB_USERNAME: ${POSTGRES_USER:-gerenciamentissimoflow_demo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured for local demo}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-demo-admin@example.invalid}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD must be configured for local demo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured for local demo}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-demo-data:
