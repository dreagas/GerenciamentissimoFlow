spring:
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gerenciamentissimoflow}
    username: ${DB_USERNAME:gerenciamentissimoflow}
    password: ${DB_PASSWORD:gerenciamentissimoflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-signing-key-do-not-use-in-production-123456}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
logging:
  level:
    com.dreagas.gerenciamentissimoflow: DEBUG
    org.springframework.web: INFO
    org.springframework.security: WARN
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
